name: Content correction
description: Suggest a factual correction or clarification to an article, lab, or training resource.
title: "content: "
labels: [content]
body:
  - type: input
    id: resource
    attributes:
      label: Resource URL or title
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Suggested correction
      description: Explain what needs changing and include a source where possible.
    validations:
      required: true
